# siderust-pod — single-crate Precise Orbit Determination toolkit.
#
# The previous multi-crate workspace has been collapsed: every former
# sub-crate is now a module inside this single library.  The
# [workspace] block is kept only to let `target-sgp4-test/probe`
# inherit its edition/version metadata.

[package]
name         = "siderust-pod"
version      = "0.0.0"
edition      = "2021"
rust-version = "1.82"
authors      = ["Siderust authors"]
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/Siderust/siderust-pod"
homepage     = "https://github.com/Siderust/siderust-pod"
keywords     = ["satellite", "pod", "orbit-determination", "geodesy", "gnss"]
categories   = ["science", "aerospace"]
publish      = false
description  = "Precise Orbit Determination toolkit (POD) built on siderust, qtty, tempoch, and affn."

[lib]
name = "siderust_pod"
path = "src/lib.rs"

[[bin]]
name = "siderust-pod"
path = "src/bin/siderust-pod.rs"

[[bin]]
name = "siderust-pod-rest"
path = "src/bin/siderust-pod-rest.rs"

[[example]]
name = "03_lambert_earth_to_mars"
path = "examples/03_lambert_earth_to_mars.rs"

[[example]]
name = "04_sgp4_from_tle"
path = "examples/04_sgp4_from_tle.rs"

[features]
default = ["serde"]
## Serde Serialize/Deserialize impls on core POD types.
serde   = ["dep:serde", "dep:serde_json"]
## DORIS RINEX observation parser in the io module.
doris   = []
## LISA inter-satellite range observation model.
lisa    = []
## Integration tests that load a JPL DE kernel from disk (de440/de441).
de440   = []
## Parquet residuals writer in the products module.
parquet = ["dep:parquet"]

[dependencies]
# ── Baseline crates ───────────────────────────────────────────────────────────
qtty-core = { version = "0.8", path = "../qtty/qtty-core" }
qtty      = { version = "0.8", path = "../qtty/qtty", features = ["astro"] }
tempoch   = { version = "0.4", path = "../tempoch/tempoch" }
affn      = { version = "0.7", path = "../affn", features = ["astro"] }
cheby     = { version = "0.2", path = "../cheby" }
siderust  = { version = "0.7", path = "../siderust" }

# ── SGP4 propagation backend ──────────────────────────────────────────────────
sgp4 = { version = "2.4", default-features = false, features = ["std"] }

# ── Linear algebra ────────────────────────────────────────────────────────────
faer = { version = "0.22", default-features = false, features = ["std", "linalg"] }

# ── Serialisation ─────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# serde_yaml is always required (used unconditionally in the service module).
serde_yaml = "0.9"

# ── Error handling ────────────────────────────────────────────────────────────
thiserror = "1.0"
anyhow    = "1.0"

# ── Hashing ───────────────────────────────────────────────────────────────────
sha2 = "0.10"
hex  = "0.4"

# ── Time ──────────────────────────────────────────────────────────────────────
chrono = "0.4"

# ── XML parsing ───────────────────────────────────────────────────────────────
quick-xml = "0.36"

# ── HTTP / REST ───────────────────────────────────────────────────────────────
axum  = "0.7"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
uuid  = { version = "1.10", features = ["v4"] }

# ── CLI ───────────────────────────────────────────────────────────────────────
clap = { version = "4.5", features = ["derive"] }

# ── Logging ───────────────────────────────────────────────────────────────────
log        = "0.4"
env_logger = "0.11"

# ── Optional: Parquet residuals ───────────────────────────────────────────────
parquet = { version = "52", default-features = false, optional = true }

[dev-dependencies]
approx   = "0.5"
trybuild = "1.0"
serde    = { version = "1.0", features = ["derive"] }
toml     = "0.8"

# ── Workspace (minimal — only for the sgp4-probe fixture) ─────────────────────
[workspace]
resolver = "2"
members  = ["target-sgp4-test/probe"]

[workspace.package]
version      = "0.0.0"
edition      = "2021"
rust-version = "1.82"
authors      = ["Siderust authors"]
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/Siderust/siderust-pod"
homepage     = "https://github.com/Siderust/siderust-pod"
keywords     = ["satellite", "pod", "orbit-determination", "geodesy", "gnss"]
categories   = ["science", "aerospace"]

[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all           = { level = "deny", priority = -1 }
todo          = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
print_stdout  = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# ── Redirect transitive crates.io pulls to the local path checkouts ───────────
[patch.crates-io]
qtty-core    = { path = "../qtty/qtty-core" }
tempoch-core = { path = "../tempoch/tempoch-core" }
qtty         = { path = "../qtty/qtty" }
tempoch      = { path = "../tempoch/tempoch" }
affn         = { path = "../affn" }
siderust     = { path = "../siderust" }

[patch."https://github.com/Siderust/affn.git"]
affn = { path = "../affn" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

[profile.bench]
opt-level = 3
lto       = "thin"

[lints]
workspace = true
