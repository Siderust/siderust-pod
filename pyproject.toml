[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "siderust-pod"
version = "0.0.0"
description = "Python bindings for the Siderust POD pipeline."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.9"

[tool.maturin]
manifest-path = "crates/siderust-pod-py/Cargo.toml"
module-name = "siderust_pod"
features = ["pyo3/extension-module"]
